services:
  postgres:
    image: postgres:18
    container_name: gossipuerj-postgres
    environment:
      POSTGRES_DB: gossipuerj
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/MAJOR/docker

volumes:
  postgres_data: